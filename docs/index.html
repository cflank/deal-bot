<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>比价机器人已搬家</title>
<style>
:root { --shelf: #F3F4F1; --tag: #FFFFFF; --ink: #151515; --mute: #666963; --clearance: #FFD60A; }
@media (prefers-color-scheme: dark) {
  :root { --shelf: #151515; --tag: #222320; --ink: #F3F4F1; --mute: #A3A69F; }
}
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
  background: var(--shelf); color: var(--ink);
  font: 17px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
main { max-width: 26em; background: var(--tag); border: 1.5px solid var(--ink); border-radius: 6px; padding: 24px; }
h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.25; }
h1 span { background: var(--clearance); color: #151515; padding: 0 6px; }
p { margin: 0 0 10px; }
.mute { color: var(--mute); font-size: 15px; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>比价机器人<span>已搬家</span></h1>
  <p>这个看板和设置页已经停用。降价提醒、看板和商品设置都搬到了新网站，用手机号登录。</p>
  <p class="mute">这里的价格数据从 2026 年 11 月 13 日起不再更新。</p>
</main>
</body>
</html>
